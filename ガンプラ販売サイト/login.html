<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yamazonログイン</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background-color: #ffffff;
    }
    .amazon-btn {
      background: linear-gradient(to bottom, #f7dfa5, #f0c14b);
      border: 1px solid #a88734;
      border-color: #a88734 #9c7e31 #846a29;
    }
    .amazon-btn:hover {
      background: linear-gradient(to bottom, #f5d78e, #eeb933);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center pt-8 pb-12 px-4 text-gray-900 relative">

  <!-- ==================== DEMO RESULT DISPLAY (入力情報をでっかく表示) ==================== -->
  <div id="demoResultModal" class="fixed inset-0 bg-black/80 z-50 hidden flex-col items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-lg w-full p-6 text-center shadow-2xl border-4 border-red-500 animate-bounce-once">
      <div class="text-red-600 text-4xl mb-2 font-black">⚠️ DEMO LOG ⚠️</div>
      <p class="text-gray-700 font-bold mb-4 text-sm">【デモ画面】入力された情報が以下のように取得されました</p>
      
      <div class="bg-gray-100 p-4 rounded-lg border text-left space-y-3 mb-6">
        <div>
          <span class="text-xs text-gray-500 font-bold block">入力されたID / メールアドレス:</span>
          <span id="displayEmail" class="text-xl font-extrabold text-blue-600 break-all">---</span>
        </div>
        <div class="border-t pt-2">
          <span class="text-xs text-gray-500 font-bold block">入力されたパスワード:</span>
          <span id="displayPassword" class="text-xl font-extrabold text-red-600 break-all">---</span>
        </div>
      </div>

      <button onclick="finishDemo()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3 rounded-lg text-base shadow cursor-pointer transition">
        理解しました（トップページへ戻る）
      </button>
    </div>
  </div>

  <!-- ==================== REALISTIC LOADING OVERLAY ==================== -->
  <div id="loginLoader" class="fixed inset-0 bg-black/50 backdrop-blur-[2px] z-40 hidden flex-col items-center justify-center text-white transition-opacity duration-300">
    <div class="bg-white text-gray-900 px-6 py-5 rounded-lg shadow-2xl flex items-center gap-4 border border-gray-200">
      <div class="w-7 h-7 border-4 border-[#f90] border-t-transparent rounded-full animate-spin"></div>
      <span class="text-sm font-bold tracking-wide">サインインしています...</span>
    </div>
  </div>

  <div class="w-full max-w-[350px] flex flex-col items-center">
    <!-- Yamazon Logo (クリックでトップページへ戻る) -->
    <a href="index.html" class="mb-5 text-2xl font-bold tracking-tight">
      yamazon<span class="text-[#f90] font-normal text-sm leading-none">.co.jp</span>
    </a>

    <!-- Login Box -->
    <div class="w-full border border-gray-300 rounded-md p-6 bg-white shadow-sm">
      <h1 class="text-2xl font-normal mb-4">ログイン</h1>

      <form onsubmit="handleLogin(event)">
        <label class="block text-xs font-bold mb-1" for="email">Eメールまたは携帯電話番号</label>
        <input type="text" id="email" required placeholder="example@email.com" class="w-full border border-gray-400 rounded px-2.5 py-1.5 text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 mb-3">

        <div class="flex items-center justify-between mb-1">
          <label class="block text-xs font-bold" for="password">パスワード</label>
          <a href="#" class="text-xs text-sky-700 hover:underline">パスワードをお忘れですか？</a>
        </div>
        <input type="password" id="password" required placeholder="パスワードを入力" class="w-full border border-gray-400 rounded px-2.5 py-1.5 text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 mb-4">

        <button type="submit" class="w-full amazon-btn text-xs py-2 rounded-md shadow-sm font-bold text-gray-900 cursor-pointer">
          ログイン
        </button>
      </form>

      <div class="mt-4 flex items-center">
        <input type="checkbox" id="remember" class="mr-2 rounded border-gray-300">
        <label for="remember" class="text-xs text-gray-700">ログイン状態を保持する</label>
      </div>

      <p class="text-[11px] text-gray-600 mt-4 leading-relaxed">
        続行することで、Yamazonの<a href="#" class="text-sky-700 hover:underline">利用規約</a>および<a href="#" class="text-sky-700 hover:underline">プライバシー規約</a>に同意することになります。
      </p>

      <div class="mt-4 pt-3 border-t border-gray-200">
        <a href="#" class="text-xs text-sky-700 hover:underline hover:text-amber-600 font-medium">困ったときはこちら</a>
      </div>
    </div>

    <!-- Create Account Button -->
    <div class="w-full mt-6 text-center">
      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-gray-300"></div>
        <span class="flex-shrink mx-2 text-xs text-gray-500">Yamazonの新しいお客様ですか？</span>
        <div class="flex-grow border-t border-gray-300"></div>
      </div>
      <button onclick="alert('デモアカウント登録画面です');" class="w-full border border-gray-400 bg-gray-50 hover:bg-gray-100 text-xs py-2 rounded-md mt-2 shadow-sm font-medium cursor-pointer">
        Yamazonアカウントを作成
      </button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-[11px] text-gray-500 text-center mt-12 pt-6 border-t border-gray-200 w-full max-w-[500px]">
    <div class="flex justify-center gap-6 mb-3 text-sky-700">
      <a href="#" class="hover:underline">利用規約</a>
      <a href="#" class="hover:underline">プライバシー規約</a>
      <a href="#" class="hover:underline">ヘルプ</a>
    </div>
    <p>© 1996-2026, Yamazon.com, Inc. or its affiliates</p>
  </footer>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      const emailVal = document.getElementById('email').value;
      const passVal = document.getElementById('password').value;

      const loader = document.getElementById('loginLoader');
      loader.classList.remove('hidden');
      loader.classList.add('flex');

      // 1秒ローディングのあと、でっかく表示するモーダルを出す
      setTimeout(() => {
        loader.classList.remove('flex');
        loader.classList.add('hidden');

        document.getElementById('displayEmail').innerText = emailVal;
        document.getElementById('displayPassword').innerText = passVal;

        const modal = document.getElementById('demoResultModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }, 1000);
    }

    function finishDemo() {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
